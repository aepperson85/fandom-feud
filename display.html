            background-size: cover;

        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* Reserved for Zack's live camera overlay - no border/fill of our own,
           positioned/sized to match the transparent window in the branding overlay */
        .game-top-row {
            flex: 1;
            display: flex;
            gap: 20px;
            min-height: 0;
            padding: 0 40px;
            position: relative;
            z-index: 1;
        }

        .camera-space {
            flex: 0 0 65%;
        }

        .game-content-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
            min-width: 0;
            padding-top: 12%;
        }

        .question {
            font-size: 1.8em;
            background: rgba(10, 22, 40, 0.6);
            padding: 20px;
            border-radius: 20px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .answers-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
        }

        .answer-card {
            background: #2a5298;
            border-radius: 40px;
            padding: 14px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.4);
        }

        .answer-card.revealed {
            background: linear-gradient(135deg, #a020c0 0%, #c026d3 100%);
            box-shadow: 0 5px 25px rgba(192, 38, 211, 0.4);
        }

        .answer-number {
            font-size: 1.3em;
            font-weight: 400;
            min-width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .answer-text {
            font-size: 1.3em;
            flex: 1;
            text-align: left;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .answer-text.hidden {
            visibility: hidden;
        }

        .answer-points {
            font-size: 1.4em;
            font-weight: 400;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .answer-points.hidden {
            visibility: hidden;
        }

        .game-bottom-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 20px 40px;
            position: relative;
            z-index: 1;
        }

        .team-score-left, .team-score-right {
            flex: 0 0 180px;
            background: rgba(10, 22, 40, 0.7);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        .team-name {
            font-size: 1.4em;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .score {
            font-size: 2.6em;
            font-weight: 400;
        }

        .strikes-container {
            display: flex;
            gap: 15px;
        }

        .strike-box {
            width: 80px;
            height: 80px;
            background: rgba(10, 22, 40, 0.7);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        .strike {
            font-size: 3.5em;
            color: #ff0000;
            text-shadow: 0 0 20px #ff0000, 3px 3px 6px rgba(0, 0, 0, 0.8);
            font-weight: 400;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .strike.visible {
            opacity: 1;
        }
    </style>
</head>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script>
        // Firebase configuration
        const firebaseConfig = {
          apiKey: "AIzaSyDHCUOL96pVa4F44OeOX5j6tgAm739XGeM",
          authDomain: "fandom-feud.firebaseapp.com",
          databaseURL: "https://fandom-feud-default-rtdb.firebaseio.com",
          projectId: "fandom-feud",
          storageBucket: "fandom-feud.firebasestorage.app",
          messagingSenderId: "355989427943",
          appId: "1:355989427943:web:6573493a3d273d326cf442"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let gameState = {
            question: "",
            answers: [],
            team1: { name: "TEAM 1", score: 0 },
            team2: { name: "TEAM 2", score: 0 },
            strikes: 0
        };

        // This page only ever reads - the control panel is the one writing
        db.ref('gameState').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                gameState = data;
                renderDisplay();
            }
        });

        function renderDisplay() {
            document.getElementById('questionDisplay').textContent = gameState.question;

            const answersDisplay = document.getElementById('answersDisplay');
            answersDisplay.innerHTML = '';

            gameState.answers.forEach((answer, index) => {
                const card = document.createElement('div');
                card.className = `answer-card ${answer.revealed ? 'revealed' : ''}`;
                card.innerHTML = `
                    <div class="answer-number">${index + 1}</div>
                    <div class="answer-text ${!answer.revealed ? 'hidden' : ''}">${answer.text.toUpperCase()}</div>
                    <div class="answer-points ${!answer.revealed ? 'hidden' : ''}">${answer.points}</div>
                `;
                answersDisplay.appendChild(card);
            });

            document.getElementById('team1Name').textContent = gameState.team1.name;
            document.getElementById('team1Score').textContent = gameState.team1.score;
            document.getElementById('team2Name').textContent = gameState.team2.name;
            document.getElementById('team2Score').textContent = gameState.team2.score;

            for (let i = 1; i <= 3; i++) {
                document.getElementById(`strike${i}`).classList.toggle('visible', i <= gameState.strikes);
            }
        }
    </script>
