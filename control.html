<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fandom Feud - Control Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0a1628;
            color: white;
        }

        .control-panel {
            height: 100vh;
            padding: 20px;
            background: #0a1628;
            overflow-y: auto;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-weight: bold;
            color: #ecf0f1;
        }

        .input-group input, .input-group textarea {
            padding: 10px;
            border: 2px solid #2a5298;
            border-radius: 5px;
            font-size: 16px;
            background: #ecf0f1;
        }

        .input-group textarea {
            resize: vertical;
            min-height: 100px;
            font-family: monospace;
        }

        .question-bank {
            background: #1e3c72;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 3px solid #000000;
        }

        .question-bank h2 {
            color: #ffffff;
            margin-bottom: 15px;
        }

        .score-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .score-control-group {
            background: #1e3c72;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #000000;
        }

        .score-control-group h3 {
            color: #ffffff;
            margin-bottom: 10px;
        }

        .score-input {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .score-input input {
            flex: 1;
            padding: 8px;
            border: 2px solid #2a5298;
            border-radius: 5px;
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-primary { background: #2a5298; color: white; border: 2px solid #000000; }
        .btn-success { background: #1e3c72; color: white; border: 2px solid #000000; }
        .btn-danger { background: #8b0000; color: white; border: 2px solid #000000; }
        .btn-warning { background: #0a1628; color: white; border: 2px solid #2a5298; }
        .btn-info { background: #2a5298; color: white; border: 2px solid #000000; }

        .control-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .answers-list {
            background: #1e3c72;
            padding: 20px;
            border-radius: 10px;
            border: 3px solid #000000;
        }

        .answers-list h2 {
            color: #ffffff;
            margin-bottom: 15px;
        }

        .answer-control {
            background: #0a1628;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 3px solid #2a5298;
        }

        .answer-control.revealed {
            border-color: #ffffff;
            background: #1e3c72;
        }

        .answer-info {
            flex: 1;
            color: white;
        }

        .answer-control-text {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .answer-control-points {
            color: #ffffff;
            font-size: 1.1em;
        }

        /* Mobile adjustments - this page is designed mobile-first */
        @media (min-width: 769px) {
            .desktop-only {
                display: block;
            }
        }

        @media (max-width: 768px) {
            .desktop-only {
                display: none !important;
            }
            .control-buttons {
                grid-template-columns: 1fr;
            }
            .btn {
                font-size: 1.15em;
                padding: 18px;
            }
            #questionSelect {
                font-size: 1.2em;
                padding: 15px;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="control-panel" id="controlPanel">

        <div id="questionWarning" style="display:none; background:#8b0000; color:#ffffff; border:3px solid #000000; border-radius:10px; padding:15px; margin-bottom:20px; font-weight:bold;"></div>

        <!-- Question Bank -->
        <div class="question-bank">
            <h2>Current Question</h2>
            <select id="questionSelect" onchange="loadQuestion(parseInt(this.value))" style="width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #2a5298; font-size: 1.1em;">
                <!-- Options generated here -->
            </select>
        </div>

        <!-- Score Controls -->
        <div class="score-controls desktop-only">
            <div class="score-control-group">
                <h3>Team 1</h3>
                <div class="input-group" style="margin-bottom: 10px;">
                    <label>Team Name:</label>
                    <input type="text" id="team1NameInput" value="TEAM 1" placeholder="Team 1 Name">
                    <button class="btn btn-primary" onclick="updateTeamName(1)" style="margin-top: 5px;">Update Name</button>
                </div>
                <div class="score-input">
                    <input type="number" id="team1ScoreInput" value="0" min="0">
                    <button class="btn btn-primary" onclick="updateTeamScore(1)">Update Score</button>
                </div>
            </div>

            <div class="score-control-group">
                <h3>Team 2</h3>
                <div class="input-group" style="margin-bottom: 10px;">
                    <label>Team Name:</label>
                    <input type="text" id="team2NameInput" value="TEAM 2" placeholder="Team 2 Name">
                    <button class="btn btn-primary" onclick="updateTeamName(2)" style="margin-top: 5px;">Update Name</button>
                </div>
                <div class="score-input">
                    <input type="number" id="team2ScoreInput" value="0" min="0">
                    <button class="btn btn-primary" onclick="updateTeamScore(2)">Update Score</button>
                </div>
            </div>
        </div>

        <!-- Round Pot Control -->
        <div class="score-control-group" style="margin-bottom: 20px; background: #1e3c72; border: 3px solid #ffffff;">
            <h3 style="color: #ffffff;">Round Pot: <span id="roundPotDisplay" style="color: #ffffff;">0</span> Points</h3>
            <p style="color: #ffffff; opacity: 0.8; margin: 10px 0;">Revealed answers accumulate here. Award to winning team at end of round.</p>
            <div class="control-buttons">
                <button class="btn btn-success" onclick="awardPotToTeam(1)" style="font-size: 1.1em;">
                    Award to <span id="awardTeam1Name">Team 1</span>
                </button>
                <button class="btn btn-primary" onclick="awardPotToTeam(2)" style="font-size: 1.1em;">
                    Award to <span id="awardTeam2Name">Team 2</span>
                </button>
            </div>
        </div>

        <!-- Strike & Round Controls -->
        <div class="score-control-group" style="margin-bottom: 20px;">
            <h3>Strikes & Round Controls</h3>
            <div class="control-buttons">
                <button class="btn btn-danger" onclick="addStrike()">Add Strike (X)</button>
                <button class="btn btn-warning" onclick="removeStrike()">Remove Strike</button>
                <button class="btn btn-info" onclick="clearStrikes()">Clear Strikes</button>
                <button class="btn btn-danger" onclick="resetAll()">Reset All</button>
            </div>
        </div>

        <!-- Display Background -->
        <div class="score-control-group" style="margin-bottom: 20px;">
            <h3>Display Background</h3>
            <p style="color: #ffffff; opacity: 0.8; margin: 10px 0;">Changes the background on every display screen at once.</p>
            <select id="backgroundSelect" onchange="setBackground(this.value)" style="width: 100%; padding: 14px; font-size: 16px; border-radius: 8px; border: 2px solid #000000; background: #0a1628; color: #ffffff;"></select>
        </div>

        <!-- Answer Controls -->
        <div class="answers-list">
            <h2>Answer Controls - Current Question</h2>
            <div id="answerControls">
                <!-- Answer controls will be dynamically generated here -->
            </div>
        </div>
    </div>

    <script src="backgrounds.js"></script>
    <script src="questions.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script>
        // Firebase configuration
        const firebaseConfig = {
          apiKey: "AIzaSyDHCUOL96pVa4F44OeOX5j6tgAm739XGeM",
          authDomain: "fandom-feud.firebaseapp.com",
          databaseURL: "https://fandom-feud-default-rtdb.firebaseio.com",
          projectId: "fandom-feud",
          storageBucket: "fandom-feud.firebasestorage.app",
          messagingSenderId: "355989427943",
          appId: "1:355989427943:web:6573493a3d273d326cf442"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let firebaseReady = false;

        // Questions come from questions.js (edit that file to add or change questions)
        let questionBank = [];
        let questionProblems = [];
        (function loadQuestionsFromFile() {
            const raw = window.QUESTIONS;
            if (!Array.isArray(raw)) {
                questionProblems.push('questions.js did not load. Check that the file is in the repo next to control.html, and that it has no typos (a missing comma or quote mark).');
                return;
            }
            raw.forEach((q, i) => {
                const n = i + 1;
                if (!q || typeof q.question !== 'string' || !q.question.trim()) {
                    questionProblems.push('Question ' + n + ' has no question text, so it was skipped.');
                    return;
                }
                if (!Array.isArray(q.answers) || q.answers.length === 0) {
                    questionProblems.push('Question ' + n + ' has no answers, so it was skipped.');
                    return;
                }
                const answers = [];
                let bad = false;
                q.answers.forEach((a, j) => {
                    const text = Array.isArray(a) ? a[0] : null;
                    const points = Array.isArray(a) ? Number(a[1]) : NaN;
                    if (typeof text !== 'string' || !text.trim() || !isFinite(points)) {
                        questionProblems.push('Question ' + n + ', answer ' + (j + 1) + ' should look like ["Text", 10], so the question was skipped.');
                        bad = true;
                    } else {
                        answers.push({ text: text.trim(), points: points });
                    }
                });
                if (bad) return;
                if (answers.length > 8) {
                    questionProblems.push('Question ' + n + ' has ' + answers.length + ' answers. Screens fit up to about 8 comfortably.');
                }
                questionBank.push({ n: n, question: q.question.trim(), answers: answers });
            });
        })();
        // Game state
        let gameState = {
            currentQuestionIndex: 0,
            question: "",
            answers: [],
            team1: { name: "TEAM 1", score: 0 },
            team2: { name: "TEAM 2", score: 0 },
            strikes: 0,
            roundPot: 0
        };

        // Audio context for sound effects
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioContext = new AudioContext();

        // Generate aggressive buzzer sound
        function playBuzzer() {
            const oscillator1 = audioContext.createOscillator();
            const oscillator2 = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator1.connect(gainNode);
            oscillator2.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator1.frequency.value = 150;
            oscillator2.frequency.value = 155;
            oscillator1.type = 'sawtooth';
            oscillator2.type = 'square';

            gainNode.gain.setValueAtTime(0.5, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.8);

            oscillator1.start(audioContext.currentTime);
            oscillator2.start(audioContext.currentTime);
            oscillator1.stop(audioContext.currentTime + 0.8);
            oscillator2.stop(audioContext.currentTime + 0.8);
        }

        // Generate reveal sound
        function playReveal() {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(800, audioContext.currentTime + 0.2);
            oscillator.type = 'sine';

            gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
        }

        // Save to Firebase (syncs to the display page and any other control device instantly)
        function saveToStorage() {
            db.ref('gameState').set(gameState);
        }

        // Listen for changes from Firebase, from any device, in real time
        db.ref('gameState').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                gameState = data;
                renderControls();
                renderQuestionButtons();
            } else if (!firebaseReady) {
                loadQuestion(0);
            }
            firebaseReady = true;
        });

        // Load question
        function loadQuestion(index) {
            if (index >= 0 && index < questionBank.length) {
                gameState.currentQuestionIndex = index;
                gameState.question = questionBank[index].question;
                gameState.answers = questionBank[index].answers.map(a => ({
                    text: a.text, points: a.points, revealed: false
                }));
                gameState.strikes = 0;
                gameState.roundPot = 0;

                saveToStorage();
                renderControls();
                renderQuestionButtons();
            }
        }

        // Render question dropdown
        function renderQuestionButtons() {
            const select = document.getElementById('questionSelect');
            select.innerHTML = '';
            questionBank.forEach((q, index) => {
                const option = document.createElement('option');
                option.value = index;
                const preview = q.question.length > 38 ? q.question.slice(0, 38).trim() + '...' : q.question;
                option.textContent = `${q.n}. ${preview}`;
                if (index === gameState.currentQuestionIndex) option.selected = true;
                select.appendChild(option);
            });
        }

        // Render controls
        function renderControls() {
            const answerControls = document.getElementById('answerControls');
            answerControls.innerHTML = '';

            gameState.answers.forEach((answer, index) => {
                const control = document.createElement('div');
                control.className = `answer-control ${answer.revealed ? 'revealed' : ''}`;

                if (answer.revealed) {
                    control.innerHTML = `
                        <div class="answer-info">
                            <div class="answer-control-text">${index + 1}. ${answer.text}</div>
                            <div class="answer-control-points">${answer.points} points - REVEALED</div>
                        </div>
                        <button class="btn btn-warning" onclick="hideAnswer(${index})">Hide</button>
                    `;
                } else {
                    control.innerHTML = `
                        <div class="answer-info">
                            <div class="answer-control-text">${index + 1}. ${answer.text}</div>
                            <div class="answer-control-points">${answer.points} points</div>
                        </div>
                        <button class="btn btn-success" onclick="revealAnswer(${index})" style="width: 100%;">
                            Reveal Answer
                        </button>
                    `;
                }
                answerControls.appendChild(control);
            });

            document.getElementById('team1NameInput').value = gameState.team1.name;
            document.getElementById('team1ScoreInput').value = gameState.team1.score;
            document.getElementById('team2NameInput').value = gameState.team2.name;
            document.getElementById('team2ScoreInput').value = gameState.team2.score;

            document.getElementById('roundPotDisplay').textContent = gameState.roundPot;
            document.getElementById('awardTeam1Name').textContent = gameState.team1.name;
            document.getElementById('awardTeam2Name').textContent = gameState.team2.name;
        }

        // Reveal answer and add points to round pot
        function revealAnswer(index) {
            if (!gameState.answers[index].revealed) {
                gameState.answers[index].revealed = true;
                gameState.roundPot += gameState.answers[index].points;
                playReveal();
                saveToStorage();
                renderControls();
            }
        }

        // Hide answer
        function hideAnswer(index) {
            if (gameState.answers[index].revealed) {
                gameState.answers[index].revealed = false;
                gameState.roundPot -= gameState.answers[index].points;
                saveToStorage();
                renderControls();
            }
        }

        // Update team score
        function updateTeamScore(team) {
            const score = parseInt(document.getElementById(`team${team}ScoreInput`).value) || 0;
            gameState[`team${team}`].score = score;
            saveToStorage();
            renderControls();
        }

        // Update team name
        function updateTeamName(team) {
            const name = document.getElementById(`team${team}NameInput`).value.trim().toUpperCase() || `TEAM ${team}`;
            gameState[`team${team}`].name = name;
            saveToStorage();
            renderControls();
        }

        // Award round pot to team
        function awardPotToTeam(team) {
            if (gameState.roundPot > 0) {
                gameState[`team${team}`].score += gameState.roundPot;
                gameState.roundPot = 0;
                saveToStorage();
                renderControls();
            }
        }

        // Strike management
        function addStrike() {
            if (gameState.strikes < 3) {
                gameState.strikes++;
                playBuzzer();
                saveToStorage();
                renderControls();
            }
        }

        function removeStrike() {
            if (gameState.strikes > 0) {
                gameState.strikes--;
                saveToStorage();
                renderControls();
            }
        }

        function clearStrikes() {
            gameState.strikes = 0;
            saveToStorage();
            renderControls();
        }

        // Reset everything
        function resetAll() {
            if (confirm('Are you sure you want to reset everything?')) {
                gameState.team1.score = 0;
                gameState.team2.score = 0;
                gameState.strikes = 0;
                gameState.roundPot = 0;
                gameState.answers.forEach(answer => answer.revealed = false);
                saveToStorage();
                renderControls();
            }
        }

        // Display background - options come from backgrounds.js, choice is saved in Firebase
        const BACKGROUNDS = window.BACKGROUNDS || [{ id: 'black', label: 'Plain Black' }];
        const DEFAULT_BACKGROUND = window.DEFAULT_BACKGROUND || BACKGROUNDS[0].id;
        const backgroundSelect = document.getElementById('backgroundSelect');
        BACKGROUNDS.forEach(b => {
            const o = document.createElement('option');
            o.value = b.id;
            o.textContent = b.label;
            backgroundSelect.appendChild(o);
        });
        function setBackground(id) {
            db.ref('settings/background').set(id);
        }
        db.ref('settings/background').on('value', (snapshot) => {
            const id = snapshot.val();
            backgroundSelect.value = BACKGROUNDS.some(b => b.id === id) ? id : DEFAULT_BACKGROUND;
        });

        // Initialize (Firebase listeners above load everything automatically)
        renderQuestionButtons();
        if (questionProblems.length) {
            const w = document.getElementById('questionWarning');
            w.innerHTML = 'Fix needed in questions.js:<br>' + questionProblems.map(p => '- ' + p).join('<br>');
            w.style.display = 'block';
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key.toLowerCase() === 'x') addStrike();
        });
    </script>
</body>
</html>
