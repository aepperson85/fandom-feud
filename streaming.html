<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fandom Feud - Display</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            overflow: hidden;
            color: white;
        }

        /* ===== SIZE KNOB =====
           Change --scale to make EVERYTHING on the display bigger or smaller.
           1 = original size. Every size below is in em, so it all follows this one number. */
        .game-display {
            --scale: 1.35;
            font-size: calc(var(--scale) * 1.48vmin);
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0;
            position: relative;
            font-family: 'Dosis', sans-serif;
            font-weight: 400;
            text-transform: uppercase;
            overflow: hidden;
            background: #000;
        }

        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* Reserved for Zack's live camera overlay - no border/fill of our own,
           positioned/sized to match the transparent window in the branding overlay */
        .game-top-row {
            flex: 1;
            display: flex;
            gap: 1em;
            min-height: 0;
            padding: 0 2em;
            position: relative;
            z-index: 1;
        }

        .camera-space {
            flex: 0 0 65%;
        }

        .game-content-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.8em;
            min-width: 0;
            padding-top: 12%;
            padding-bottom: 0.6em;
            /* --fit is set by the script so long questions always fit on screen */
            font-size: calc(1em * var(--fit, 1));
        }

        .question {
            font-size: 1.8em;
            background: var(--q-bg, rgba(10, 22, 40, 0.6));
            color: var(--q-text, #ffffff);
            border: var(--q-border, 0 solid transparent);
            padding: 0.55em;
            border-radius: 0.45em;
            text-shadow: var(--text-shadow, 0.06em 0.06em 0.12em rgba(0, 0, 0, 0.8));
            box-shadow: 0 0.1em 0.4em rgba(0, 0, 0, 0.5);
            text-align: center;
            line-height: 1.1;
        }

        .answers-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.5em;
        }

        .answer-card {
            background: var(--card-bg, #2a5298);
            border: var(--card-border, 0 solid transparent);
            border-radius: 2em;
            padding: 0.4em 1em;
            display: flex;
            align-items: center;
            gap: 0.8em;
            transition: all 0.3s ease;
            box-shadow: 0 0.15em 0.75em rgba(0, 0, 0, 0.4);
        }

        .answer-card.revealed {
            background: var(--rev-bg, linear-gradient(135deg, #a020c0 0%, #c026d3 100%));
            border: var(--rev-border, 0 solid transparent);
            box-shadow: 0 0.25em 1.25em var(--rev-glow, rgba(192, 38, 211, 0.4));
        }

        .answer-number {
            font-size: 1.3em;
            font-weight: 400;
            min-width: 1.7em;
            height: 1.7em;
            border-radius: 50%;
            background: var(--num-bg, rgba(0, 0, 0, 0.3));
            color: var(--num-text, #ffffff);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .answer-card.revealed .answer-number {
            background: var(--rev-num-bg, rgba(0, 0, 0, 0.3));
            color: var(--rev-num-text, #ffffff);
        }

        .answer-text {
            font-size: 1.35em;
            flex: 1;
            text-align: left;
            line-height: 1.1;
            color: var(--rev-text, #ffffff);
            text-shadow: var(--text-shadow, 0.06em 0.06em 0.12em rgba(0, 0, 0, 0.8));
        }

        .answer-text.hidden {
            visibility: hidden;
        }

        .answer-points {
            font-size: 1.5em;
            font-weight: 400;
            color: var(--rev-text, #ffffff);
            text-shadow: var(--text-shadow, 0.06em 0.06em 0.12em rgba(0, 0, 0, 0.8));
        }

        .answer-points.hidden {
            visibility: hidden;
        }

        .game-bottom-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1em;
            padding: 1em 2em;
            position: relative;
            z-index: 1;
        }

        .team-score-left, .team-score-right {
            flex: 0 0 11em;
            background: var(--panel-bg, rgba(10, 22, 40, 0.7));
            color: var(--panel-text, #ffffff);
            border-radius: 0.8em;
            padding: 0.6em 0.8em;
            text-align: center;
            box-shadow: 0 0.25em 1em rgba(0, 0, 0, 0.5);
        }

        .team-name {
            font-size: 1.6em;
            margin-bottom: 0.1em;
            color: var(--panel-text, #ffffff);
            line-height: 1.1;
        }

        .score {
            font-size: 3.4em;
            font-weight: 400;
            line-height: 1;
        }

        .strikes-container {
            display: flex;
            gap: 0.8em;
        }

        .strike-box {
            width: 5.6em;
            height: 5.6em;
            background: var(--strike-bg, rgba(10, 22, 40, 0.7));
            border-radius: 0.8em;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0.25em 1em rgba(0, 0, 0, 0.5);
        }

        .strike {
            font-size: 4.6em;
            line-height: 1;
            color: #ff0000;
            text-shadow: 0 0 0.3em #ff0000, 0.04em 0.04em 0.08em rgba(0, 0, 0, 0.8);
            font-weight: 400;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .strike.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="game-display" id="gameDisplay" data-bg="pending">
        <video class="bg-video" id="bgVideo" autoplay muted loop playsinline></video>
        <div class="game-top-row">
            <div class="camera-space" id="cameraSpace"></div>

            <div class="game-content-panel">
                <div class="question" id="questionDisplay">NAME SOMETHING PEOPLE DO AT A GAMING CONVENTION</div>

                <div class="answers-section" id="answersDisplay">
                    <!-- Answers will be dynamically generated here -->
                </div>
            </div>
        </div>

        <div class="game-bottom-bar">
            <div class="team-score-left">
                <div class="team-name" id="team1Name">TEAM 1</div>
                <div class="score" id="team1Score">0</div>
            </div>

            <div class="strikes-container">
                <div class="strike-box">
                    <div class="strike" id="strike1">X</div>
                </div>
                <div class="strike-box">
                    <div class="strike" id="strike2">X</div>
                </div>
                <div class="strike-box">
                    <div class="strike" id="strike3">X</div>
                </div>
            </div>

            <div class="team-score-right">
                <div class="team-name" id="team2Name">TEAM 2</div>
                <div class="score" id="team2Score">0</div>
            </div>
        </div>
    </div>

    <script src="backgrounds.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script>
        // Firebase configuration
        const firebaseConfig = {
          apiKey: "AIzaSyDHCUOL96pVa4F44OeOX5j6tgAm739XGeM",
          authDomain: "fandom-feud.firebaseapp.com",
          databaseURL: "https://fandom-feud-default-rtdb.firebaseio.com",
          projectId: "fandom-feud",
          storageBucket: "fandom-feud.firebasestorage.app",
          messagingSenderId: "355989427943",
          appId: "1:355989427943:web:6573493a3d273d326cf442"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ===== Background (chosen from the control panel; options live in backgrounds.js) =====
        const BACKGROUNDS = window.BACKGROUNDS || [{ id: 'black', label: 'Plain Black', color: '#000' }];
        const DEFAULT_BACKGROUND = window.DEFAULT_BACKGROUND || BACKGROUNDS[0].id;

        let appliedThemeVars = [];

        function applyBackground(id) {
            const opt = BACKGROUNDS.find(b => b.id === id) || BACKGROUNDS.find(b => b.id === DEFAULT_BACKGROUND) || BACKGROUNDS[0];
            const display = document.getElementById('gameDisplay');
            const video = document.getElementById('bgVideo');
            display.setAttribute('data-bg', opt.id);
            display.style.backgroundColor = opt.color || '#000';
            // Colors for this look (from backgrounds.js). No theme means the standard colors.
            appliedThemeVars.forEach(name => display.style.removeProperty(name));
            appliedThemeVars = [];
            Object.keys(opt.theme || {}).forEach(key => {
                display.style.setProperty('--' + key, opt.theme[key]);
                appliedThemeVars.push('--' + key);
            });
            display.style.backgroundImage = opt.image ? 'url("' + opt.image + '")' : 'none';
            display.style.backgroundSize = 'cover';
            display.style.backgroundPosition = 'center';
            if (opt.video) {
                video.style.display = 'block';
                if (video.getAttribute('src') !== opt.video) {
                    video.setAttribute('src', opt.video);
                    const p = video.play();
                    if (p && p.catch) p.catch(() => {});
                }
            } else {
                video.style.display = 'none';
                if (video.getAttribute('src')) {
                    // Fully unload the video so it stops downloading
                    video.pause();
                    video.removeAttribute('src');
                    video.load();
                }
            }
            try { localStorage.setItem('ffBackground', opt.id); } catch (e) {}
        }

        // Apply last known mode instantly (avoids a flash), then Firebase confirms it
        try {
            const cached = localStorage.getItem('ffBackground');
            if (cached) applyBackground(cached);
        } catch (e) {}

        db.ref('settings/background').on('value', (snapshot) => {
            applyBackground(snapshot.val());
        });

        // ===== Auto-fit: shrink text a little if the question + answers are too tall =====
        function fitContent() {
            const panel = document.querySelector('.game-content-panel');
            let fit = 1;
            panel.style.setProperty('--fit', fit);
            while (panel.scrollHeight > panel.clientHeight && fit > 0.45) {
                fit = Math.round((fit - 0.03) * 100) / 100;
                panel.style.setProperty('--fit', fit);
            }
        }
        window.addEventListener('resize', fitContent);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitContent);

        let gameState = {
            question: "",
            answers: [],
            team1: { name: "TEAM 1", score: 0 },
            team2: { name: "TEAM 2", score: 0 },
            strikes: 0
        };

        // This page only ever reads - the control panel is the one writing
        db.ref('gameState').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                gameState = data;
                renderDisplay();
            }
        });

        function renderDisplay() {
            document.getElementById('questionDisplay').textContent = gameState.question;

            const answersDisplay = document.getElementById('answersDisplay');
            answersDisplay.innerHTML = '';

            gameState.answers.forEach((answer, index) => {
                const card = document.createElement('div');
                card.className = `answer-card ${answer.revealed ? 'revealed' : ''}`;
                card.innerHTML = `
                    <div class="answer-number">${index + 1}</div>
                    <div class="answer-text ${!answer.revealed ? 'hidden' : ''}">${answer.text.toUpperCase()}</div>
                    <div class="answer-points ${!answer.revealed ? 'hidden' : ''}">${answer.points}</div>
                `;
                answersDisplay.appendChild(card);
            });

            document.getElementById('team1Name').textContent = gameState.team1.name;
            document.getElementById('team1Score').textContent = gameState.team1.score;
            document.getElementById('team2Name').textContent = gameState.team2.name;
            document.getElementById('team2Score').textContent = gameState.team2.score;

            for (let i = 1; i <= 3; i++) {
                document.getElementById(`strike${i}`).classList.toggle('visible', i <= gameState.strikes);
            }

            fitContent();
        }
    </script>
</body>
</html>
